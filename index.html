<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f3ede1'/%3E%3Ccircle cx='13' cy='14' r='6' fill='%23a9c6d8' opacity='.7'/%3E%3Ccircle cx='20' cy='18' r='5' fill='%23b9aade' opacity='.6'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f6f1e7">
<script>
/* 首帧主题：必须在样式表之前同步执行（3.4）。
   否则夜雾用户每次启动都会看到一次「米白 → 深蓝」的 .5s 变色（#veil 只遮住一部分）。
   键名与 02-store.js 的 PREFIX("wb:") 保持一致；读失败就退回 index.html 上的静态 light。 */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem("wb:settings") || "{}");
    var t = s.theme;
    if(t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var html = document.documentElement;
    if(t === "dark" || t === "light" || t === "rose") html.dataset.theme = t;
    if(s.accent) html.dataset.accent = s.accent === "custom" ? "mist" : s.accent;
    if(s.accent === "custom" && s.accentCustom) html.style.setProperty("--accent", s.accentCustom);
    if(s.motion === false) html.classList.add("no-motion");   // 动效关掉时首帧就别播入场
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="css/main.css">
<style>
/* 本地主字体：霞鹜文楷精简子集（构建单文件时内联为 base64） */
