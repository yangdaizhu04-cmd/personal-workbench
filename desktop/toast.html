<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>提醒</title>
<!-- 桌面版的提醒卡（便携模式下代替系统通知）
     为什么不用系统通知：从 target\release 直接跑的程序没有 AUMID / 开始菜单快捷方式，
     Windows 会静默丢掉 toast（notify-rust 会退回 PowerShell 的 AUMID，而新版 Windows
     已经没有那个快捷方式了）。这张卡由我们自己弹，不依赖系统通知开关。
     这一页**不加载工作台的任何脚本**，只负责显示两行字 + 点一下唤出主窗口 -->
<style>
  @font-face{font-family:"lxgw";src:url("vendor/font/lxgw-wenkai-subset.woff2") format("woff2");font-display:swap;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:transparent;}
  body{font-family:"lxgw","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
    display:flex;align-items:center;padding:10px;}
  .card{width:100%;padding:13px 16px 14px;border-radius:16px;cursor:pointer;
    background:linear-gradient(150deg,#fbf8f2,#f3ece1);
    border:1px solid rgba(61,58,53,.10);
    box-shadow:0 10px 30px rgba(60,55,48,.22), inset 0 1px 0 rgba(255,255,255,.75);
    animation:in .34s cubic-bezier(.4,1.3,.5,1);}
  .card:hover{filter:brightness(1.015);}
  .head{display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:99px;background:#7fa3bd;flex:none;
    box-shadow:0 0 0 4px rgba(127,163,189,.16);}
  .title{font-size:15px;font-weight:600;color:#3d3a35;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .body{margin-top:6px;font-size:13.5px;color:#6c665d;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  @keyframes in{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
  /* 收场：Rust 侧会在 9 秒后关窗，这里提前做一点淡出 */
  .card.bye{animation:out .5s ease forwards;}
  @keyframes out{to{opacity:0;transform:translateY(8px) scale(.985);}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head"><span class="dot"></span><span class="title" id="t">提醒</span></div>
    <div class="body" id="b"></div>
  </div>
<script>
(function(){
  "use strict";
  const api = window.__TAURI__ && window.__TAURI__.core;
  const T = document.getElementById("t"), B = document.getElementById("b"), C = document.getElementById("card");
  if(!api){ T.textContent = "（提醒卡加载失败）"; return; }
  function paint(p){
    if(!p) return;
    C.classList.remove("bye");
    T.textContent = p.title || "提醒";
    B.textContent = p.body || "";
    void C.offsetWidth;                       // 重放动画
    C.style.animation = "in .34s cubic-bezier(.4,1.3,.5,1)";
  }
  /* 开窗时问一次内容；窗口被复用（第二条提醒）时由 Rust 推事件过来 */
  api.invoke("toast_payload").then(paint).catch(() => {});
  if(window.__TAURI__.event && window.__TAURI__.event.listen)
    window.__TAURI__.event.listen("toast:show", e => paint(e.payload));
  /* 点一下：唤出主窗口，并收掉这张卡 */
  C.addEventListener("click", () => { C.classList.add("bye"); setTimeout(() => api.invoke("toast_click").catch(() => {}), 160); });
 /* 鼠标悬停时不出局（Rust 侧的 9 秒对此无效，但至少视觉上不催） */
})();
</script>
</body>
</html>
